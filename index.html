    rate: d.interestRate ? Number(d.interestRate) / 100 / 12 : 0

    months: null,
    totalInterest: 0,
    payoffOrder: [],

    noDebts: false

    totalInterest = 0;

        d.balance += interest;
        totalInterest += interest;

    for (const d of items) {

        month

    noDebts: false

  transactions,

  const in5daysStr = in5days.toISOString().slice(0, 10);
  let pendingCount = 0;
  for (const r of recurringExpenses) {
    const status = recurringStatus(r, month, transactions);
    const due = recurringDueDateForMonth(r, month);
    if (status === "Vencida" || status === "Pendente" && due <= in5daysStr) pendingCount++;

  }

    spendingChangePct = (totalDespesas - prevTotalDespesas) / prevTotalDespesas * 100;
  }

  for (const g of goals) {
    const target = Number(g.target) || 0;
    if (target <= 0) continue;
    const pct = Number(g.current) / target * 100;
    if (pct >= 100) continue;
    if (!nearestGoal || pct > nearestGoal.pct) nearestGoal = {
      name: g.name,
      pct
    };
  }
  return {
    pendingCount,
    spendingChangePct,
    nearestGoal
